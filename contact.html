<style>
  :root{
    --white:#ffffff;
    --mint:#f3faf6;
    --mint-deep:#e6f5ec;
    --line:#dcefe2;
    --green-900:#123526;
    --green-700:#1f7a4c;
    --green-600:#2f9660;
    --green-400:#6cc79a;
    --ink:#1c2b24;
    --ink-soft:#5b6b62;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Segoe UI', Tahoma, Geneva, Arial, sans-serif;
    color:var(--ink); background:var(--mint);
    line-height:1.7; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:40px 18px 60px;
  }
  .icon-badge{
    width:60px; height:60px; border-radius:50%; background:var(--mint-deep);
    display:flex; align-items:center; justify-content:center; margin-bottom:18px;
  }
  .top{ text-align:center; max-width:520px; margin-bottom:34px; }
  .top h1{ font-size:1.6rem; color:var(--green-900); margin-bottom:10px; }
  .top p{ color:var(--ink-soft); font-size:0.95rem; }

  .phone-list{
    display:flex; flex-direction:column; gap:18px;
    width:100%; max-width:420px;
  }
  .phone-box{
    position:relative; overflow:hidden;
    background:var(--white); border:1px solid var(--line); border-radius:20px;
    padding:22px 24px; display:flex; align-items:center; gap:16px;
    text-decoration:none; color:var(--green-900);
    box-shadow:0 14px 30px -22px rgba(18,53,38,0.25);
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .phone-box::after{
    content:''; position:absolute; width:120px; height:120px; border-radius:50%;
    background:radial-gradient(circle, var(--mint-deep), transparent 70%);
    top:-50px; left:-40px; opacity:0.7; pointer-events:none;
  }
  .phone-box:hover{
    transform:translateY(-3px); background:var(--mint-deep);
    box-shadow:0 18px 36px -20px rgba(18,53,38,0.3);
  }
  .phone-box .icon-wrap{
    position:relative; width:52px; height:52px; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .phone-box .icon-ring{
    position:absolute; inset:0; border-radius:50%;
    border:2px dashed var(--green-400); opacity:0.5;
    animation: spin-slow 12s linear infinite;
  }
  @keyframes spin-slow{ to{ transform:rotate(360deg); } }
  .phone-box .icon{
    position:relative; z-index:1;
    width:42px; height:42px; border-radius:50%;
    background:linear-gradient(140deg, var(--green-400), var(--green-700));
    display:flex; align-items:center; justify-content:center; flex:none;
    box-shadow:0 8px 16px -6px rgba(31,122,76,0.5);
  }
  .phone-box .text{ position:relative; z-index:1; display:flex; flex-direction:column; gap:2px; flex:1; }
  .phone-box .number{
    font-weight:800; font-size:1.15rem; letter-spacing:0.5px;
  }
  .phone-box .hint{ font-size:0.78rem; color:var(--ink-soft); }
  .phone-box .arrow{
    position:relative; z-index:1; color:var(--green-600); flex:none;
    transition:transform .2s ease;
  }
  .phone-box:hover .arrow{ transform:translateX(-4px); }

  .back-link{ margin-top:34px; color:var(--green-700); font-size:0.9rem; text-decoration:none; font-weight:700; }
  .back-link:hover{ text-decoration:underline; }
</style>
