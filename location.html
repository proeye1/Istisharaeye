<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقع المركز | استشارة</title>
<style>
  :root{
    --white:#ffffff;
    --mint:#f3faf6;
    --mint-deep:#e6f5ec;
    --line:#dcefe2;
    --green-900:#123526;
    --green-700:#1f7a4c;
    --green-600:#2f9660;
    --green-400:#6cc79a;
    --ink:#1c2b24;
    --ink-soft:#5b6b62;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Segoe UI', Tahoma, Geneva, Arial, sans-serif;
    color:var(--ink); background:var(--mint);
    line-height:1.7; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:40px 18px 60px;
  }
  .icon-badge{
    width:60px; height:60px; border-radius:50%; background:var(--mint-deep);
    display:flex; align-items:center; justify-content:center; margin-bottom:18px;
  }
  .top{ text-align:center; max-width:520px; margin-bottom:26px; }
  .top h1{ font-size:1.5rem; color:var(--green-900); margin-bottom:12px; }
  .top p{ color:var(--ink-soft); font-size:1rem; line-height:1.9; }

  .map-wrap{
    width:100%; max-width:820px; border-radius:22px; overflow:hidden;
    border:1px solid var(--line); box-shadow:0 20px 40px -24px rgba(18,53,38,0.3);
    background:var(--white);
  }
  .map-wrap iframe{ width:100%; height:420px; border:0; display:block; }

  .actions{ display:flex; gap:14px; margin-top:26px; flex-wrap:wrap; justify-content:center; }
  .btn{
    padding:12px 26px; border-radius:100px; font-weight:700; font-size:0.95rem;
    text-decoration:none; display:inline-block;
  }
  .btn-primary{ background:var(--green-700); color:var(--white); }
  .btn-ghost{ background:var(--white); color:var(--green-700); border:1.5px solid var(--green-600); }

  .back-link{ margin-top:34px; color:var(--green-700); font-size:0.9rem; text-decoration:none; font-weight:700; }
  .back-link:hover{ text-decoration:underline; }

  @media (max-width:640px){
    .map-wrap iframe{ height:320px; }
  }
</style>
</head>
<body>

  <div class="icon-badge">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.58 7-13a7 7 0 10-14 0c0 5.42 7 13 7 13z" stroke="#1f7a4c" stroke-width="1.6"/><circle cx="12" cy="9" r="2.5" stroke="#1f7a4c" stroke-width="1.6"/></svg>
  </div>

  <div class="top">
    <h1>موقع مركز استشارة</h1>
    <p>المنصورة - طلخا - شارع صلاح سالم<br>أعلى موقف القديم (برج النور)<br>أمام مسجد غنام</p>
  </div>

  <div class="map-wrap">
    <iframe
      src="https://www.google.com/maps?q=31.0510078,31.3802967&output=embed"
      allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <div class="actions">
    <a class="btn btn-primary" href="https://maps.app.goo.gl/Vs5Q8N8a62Dh6L416" target="_blank" rel="noopener">افتح في تطبيق خرائط جوجل</a>
  </div>

  <a href="estisharah.html" class="back-link">← رجوع للموقع</a>

</body>
</html>
